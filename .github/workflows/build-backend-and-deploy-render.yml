name: Build backend image and trigger Render deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        working-directory: backend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/pulse-backend:${{ github.sha }} .

      - name: Push backend image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/pulse-backend:${{ github.sha }}

      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE: "ghcr.io/${{ github.repository_owner }}/pulse-backend:${{ github.sha }}"
        run: |
          echo "Triggering Render deploy for service $SERVICE_ID"
          curl -X POST https://api.render.com/v1/services/$SERVICE_ID/deploys \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true, "strategy":"REBUILD", "dockerImage":"'$IMAGE'"}'
